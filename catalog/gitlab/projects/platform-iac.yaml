name: Platform Iac
path: platform-iac
group: platform-devsecops
description: Platform infrastructure as code
visibility_level: private
service_accounts:
  platform_iac_automation:
    name: Platform IaC Automation
branch_protection_mode: enterprise
branch_protections:
  - name: main
    allow_force_push: false
    allowed_to_push:
      - access_level: maintainer
    allowed_to_merge:
      - access_level: maintainer
    allowed_to_unprotect:
      - access_level: maintainer
  - name: release/*
    allow_force_push: false
    allowed_to_push:
      - access_level: maintainer
    allowed_to_merge:
      - access_level: maintainer
    allowed_to_unprotect:
      - access_level: maintainer
