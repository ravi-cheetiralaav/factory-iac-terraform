name: gitlab-cicd-templates
path: gitlab-cicd-templates
group: cicd-templates
description: Shared GitLab CI/CD templates
visibility_level: private
branch_protection_mode: enterprise
branch_protections:
  - name: main
    allow_force_push: false
    allowed_to_push:
      - access_level: maintainer
    allowed_to_merge:
      - access_level: maintainer
    allowed_to_unprotect:
      - access_level: maintainer
  - name: release/*
    allow_force_push: false
    allowed_to_push:
      - access_level: maintainer
    allowed_to_merge:
      - access_level: maintainer
    allowed_to_unprotect:
      - access_level: maintainer
